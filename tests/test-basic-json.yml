name: Test basic json scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          directory: tests/fixtures/clean-project
          version: "0.19.0"
      - name: Assert action succeeded and node installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          node --version || { echo "FAIL: node not on PATH"; exit 1; }
          echo "PASS"
