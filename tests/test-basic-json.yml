name: Test basic JSON scan of a clean project
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          directory: tests/fixtures/clean-project
          version: "0.23.0"
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
      - name: Assert Node.js was installed (default 24)
        run: |
          v="$(node --version)"
          echo "node: $v"
          case "$v" in
            v24.*) echo "PASS" ;;
            *) echo "FAIL: expected Node 24"; exit 1 ;;
          esac
