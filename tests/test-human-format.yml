name: Test human output format
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run aislop action with human format
        id: action
        uses: .
        with:
          directory: ${{ github.workspace }}/tests/fixtures/scan-target-human
          format: human
          version: latest

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error (exit 0) with human format"
          echo "PASS"
