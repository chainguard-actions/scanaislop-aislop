name: Test human format output
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run aislop with human format
        id: action
        uses: .
        with:
          directory: tests/fixtures/aislop-config
          format: human
          version: "latest"

      - name: Assert action completed successfully with human format
        run: |
          echo "PASS: aislop ci completed with --human flag without error"
