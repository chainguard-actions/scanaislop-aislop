name: Test absolute directory and custom node version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          directory: ${{ github.workspace }}/tests/fixtures/clean-project
          node-version: "22"
          version: "0.19.1"
      - name: Assert action succeeded with Node 22
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          NODE_MAJOR="$(node --version | sed 's/^v//; s/\..*//')"
          echo "node major: $NODE_MAJOR"
          if [ "$NODE_MAJOR" != "22" ]; then
            echo "FAIL: expected Node 22"
            exit 1
          fi
          echo "PASS"
