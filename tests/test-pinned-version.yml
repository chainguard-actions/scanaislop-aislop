name: Test pinned CLI version
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal project to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-target/.aislop"
          # Create a simple TypeScript file to scan
          cat > "$GITHUB_WORKSPACE/scan-target/util.ts" << 'EOF'
          export function multiply(a: number, b: number): number {
            return a * b;
          }
          EOF
          # Create a permissive config so the gate always passes
          cat > "$GITHUB_WORKSPACE/scan-target/.aislop/config.yml" << 'EOF'
          version: 1
          ci:
            failBelow: 0
          EOF

      - id: action
        uses: .
        with:
          directory: scan-target
          version: "0.16.1"
          format: json

      - name: Assert action completed successfully with pinned version
        run: |
          echo "Action completed with pinned version 0.16.1"
          echo "PASS: aislop ci ran successfully with pinned CLI version"
