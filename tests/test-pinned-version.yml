name: Test pinned aislop CLI version
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run aislop action with pinned version 0.10.1
        id: action
        uses: .
        with:
          directory: ${{ github.workspace }}/tests/fixtures/scan-target
          format: json
          version: "0.10.1"

      - name: Assert action completed successfully with pinned version
        run: |
          echo "Action completed without error using pinned aislop version 0.10.1"
          echo "PASS"
