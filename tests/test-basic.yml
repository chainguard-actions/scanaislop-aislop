name: Test basic usage (relative directory, json format)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          directory: tests/fixtures/clean-project
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
      - name: Assert Node.js and npm are available after the action
        run: |
          node --version || { echo "FAIL: node not on PATH"; exit 1; }
          npm --version || { echo "FAIL: npm not on PATH"; exit 1; }
          echo "PASS"
