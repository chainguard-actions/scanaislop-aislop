name: Test absolute directory path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Assert fixture exists at absolute path
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/tests/fixtures/clean-project/src/math.js" ]; then
            echo "FAIL: fixture missing"
            exit 1
          fi
          echo "PASS"
      - id: action
        uses: .
        with:
          directory: ${{ github.workspace }}/tests/fixtures/clean-project
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
