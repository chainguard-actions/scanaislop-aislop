name: Test explicit version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal .aislop/config.yml with failBelow 0
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.aislop"
          cat > "$GITHUB_WORKSPACE/.aislop/config.yml" <<'EOF'
          version: 1
          exclude:
            - node_modules
            - .git
          engines:
            format: false
            lint: false
            code-quality: false
            ai-slop: false
            architecture: false
            security: false
          ci:
            failBelow: 0
            format: json
          EOF

      - id: action
        uses: .
        with:
          directory: "."
          format: "json"
          version: "0.18.0"

      - name: Assert action completed with explicit version
        run: |
          echo "PASS: aislop ran successfully with explicit version 0.18.0"
