name: Test specific CLI version
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run aislop with a pinned CLI version
        id: action
        uses: .
        with:
          directory: tests/fixtures/aislop-config
          version: "0.15.0"

      - name: Assert action completed successfully with pinned version
        run: |
          echo "PASS: aislop ci completed with pinned version 0.15.0 without error"
