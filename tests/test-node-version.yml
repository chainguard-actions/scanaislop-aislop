name: Test custom Node.js version input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal project to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-target/.aislop"
          # Create a simple Go file to scan
          cat > "$GITHUB_WORKSPACE/scan-target/main.go" << 'EOF'
          package main

          import "fmt"

          func main() {
            fmt.Println("Hello, World!")
          }
          EOF
          # Create a permissive config so the gate always passes
          cat > "$GITHUB_WORKSPACE/scan-target/.aislop/config.yml" << 'EOF'
          version: 1
          ci:
            failBelow: 0
          EOF

      - id: action
        uses: .
        with:
          directory: scan-target
          node-version: "20"
          format: json

      - name: Assert action completed successfully with Node.js 20
        run: |
          echo "Action completed with Node.js 20"
          echo "PASS: aislop ci ran successfully with node-version: 20"
